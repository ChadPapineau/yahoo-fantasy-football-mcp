# fixtures/manual/league.yaml — the placeholder validation league for ManualLeagueProvider
# (plan 01 §8 X1, plan 10 §3.1a). PLACEHOLDER NAMES ONLY: "Example League", "Team A".."Team L",
# "Manager A".."Manager L". The players are real 2026 NFL players (public nflverse data, CC-BY 4.0),
# taken from fixtures/players/fixture-roster.json plus a few well-known starters for the opponent.
# A real league.yaml lives at <config>/league.yaml (0600), never in this repository.
version: 1

league:
  key: example                # league key manual.l.example
  name: Example League
  season: 2026
  num_teams: 12
  scoring_type: head
  start_week: 1
  end_week: 17
  lineup_lock: per_game       # each player locks at his own kickoff
  playoffs:
    start_week: 15
    num_teams: 6

scoring:
  preset: half_ppr
  overrides:                  # the validation league's values, stated explicitly
    pass_td: 4
    rush_td: 6
    rec_td: 6
    fum_lost: -2
    pass_int: -1
  # no TE premium, no yardage bonuses

roster_slots:
  - { name: QB, count: 1 }
  - { name: WR, count: 2 }
  - { name: RB, count: 2 }
  - { name: TE, count: 1 }
  - { name: W/R/T, count: 1 }
  - { name: K, count: 1 }
  - { name: DEF, count: 1 }
  - { name: BN, count: 6 }
  - { name: IR, count: 2 }

