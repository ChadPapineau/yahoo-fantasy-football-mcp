# secrets — gitleaks with repo-specific Yahoo rules (.gitleaks.toml). Spec: docs/plan/04-repo-structure-
# and-ci.md §4.1 (`secrets` job) and §4.3 (rules); docs/plan/06-automation-inventory.md §1.1.
#
# Jobs
#   secrets           push / PR / manual: scans the commits of the push (or the PR's range) — added
#                     lines only — then the checked-out tree. Fails on any finding not allowlisted.
#   secrets-selftest  push / PR / manual: proves the rules can fire. Scans a COPY of
#                     scripts/gitleaks-selftest/must-flag.txt and requires every id in
#                     expected-rule-ids.txt in the report; then requires ZERO findings on a copy of
#                     must-pass.txt (the documentation placeholders); then scans the tree with the
#                     fixtures in place. A rule that silently matches nothing, or an allowlist wider
#                     than the placeholders, turns this job red.
#   secrets-history   weekly (Mon 06:00 UTC) and manual: the full git history, all refs.
#
# Why the gitleaks binary and not gitleaks/gitleaks-action
#   The action needs GITHUB_TOKEN for API calls (and a license for org accounts), cannot scan a single
#   directory (so no self-test), and downloads a gitleaks binary at run time anyway. Fetching the
#   release tarball ourselves (scripts/install-gitleaks.sh) gives an exact version AND a sha256, needs
#   no token at all, and gives every job the same binary. Gitleaks is free for personal accounts; no
#   license secret exists or is needed.
#
# Safe on a public repo: permissions contents: read; no secrets; `pull_request` (never
# pull_request_target); persist-credentials: false; fetch-depth: 0 only because the diff and history
# scans need the commits. Secrets are redacted from every log line (--redact).

name: secrets

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — full history
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out (full history for the diff range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version + sha256)
        run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Scan the pushed commits (added lines)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${HEAD_SHA}"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${HEAD_SHA}"
          fi
          if [ -n "$range" ]; then
            echo "scanning commit range $range"
            gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$range" .
          else
            echo "no usable base commit (manual run, new branch or force-push) — scanning the full history instead"
            gitleaks git --no-banner --redact --config .gitleaks.toml .
          fi

      - name: Scan the checked-out tree
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml .

  secrets-selftest:
    name: secrets-selftest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks (pinned version + sha256)
        run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Every custom rule must fire on a copy of must-flag.txt
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selftest-flag-copy"
          rm -rf "$work" && mkdir -p "$work"
          cp scripts/gitleaks-selftest/must-flag.txt "$work/must-flag.txt"
          set +e
          gitleaks dir --no-banner --redact --config .gitleaks.toml --exit-code 99 \
            --report-format json --report-path "$RUNNER_TEMP/must-flag.json" "$work"
          rc=$?
          set -e
          echo "self-test: gitleaks exit code on the must-flag copy = $rc (99 = leaks found, as required)"
          if [ "$rc" -ne 99 ]; then
            echo "::error::self-test: expected exit 99 (leaks) on the must-flag fixture, got $rc — a rule matched nothing, the config failed to load, or the copy was allowlisted"
            exit 1
          fi
          node scripts/gitleaks-selftest/assert-report.mjs "$RUNNER_TEMP/must-flag.json" --expect-all scripts/gitleaks-selftest/expected-rule-ids.txt

      - name: The documentation placeholders must NOT fire (copy of must-pass.txt)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/selftest-pass-copy"
          rm -rf "$work" && mkdir -p "$work"
          cp scripts/gitleaks-selftest/must-pass.txt "$work/must-pass.txt"
          set +e
          gitleaks dir --no-banner --redact --config .gitleaks.toml --exit-code 99 \
            --report-format json --report-path "$RUNNER_TEMP/must-pass.json" "$work"
          rc=$?
          set -e
          echo "self-test: gitleaks exit code on the must-pass copy = $rc (0 = clean, as required)"
          node scripts/gitleaks-selftest/assert-report.mjs "$RUNNER_TEMP/must-pass.json" --expect-none
          [ "$rc" -eq 0 ]

      - name: The tree, fixtures in place, must pass
        run: gitleaks dir --no-banner --redact --config .gitleaks.toml .

  secrets-history:
    name: secrets-history
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out (full history, all refs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version + sha256)
        run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Scan the full history (every ref)
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="--all" .

      - name: Notice when a newer gitleaks release exists (informational; npx/binary pins are not Dependabot-managed)
        run: |
          pinned="$(sed -n 's/^GITLEAKS_VERSION="\(.*\)"$/\1/p' scripts/install-gitleaks.sh)"
          latest="$(curl -fsSL --retry 2 https://api.github.com/repos/gitleaks/gitleaks/releases/latest | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1 || true)"
          echo "pinned gitleaks $pinned; latest release ${latest:-unknown}"
          if [ -n "$latest" ] && [ "$latest" != "$pinned" ]; then
            echo "::notice::gitleaks $latest is available; scripts/install-gitleaks.sh pins $pinned (bump version + sha256 together)"
          fi
